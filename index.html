<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Karácsonyi húzás</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #f7fbff;
            --muted: #9eb4c9;
            --ice: #a7f3ff;
            --pink: #ff6ba6;
            --gold: #ffd166;
            --panel: rgba(11, 22, 42, .78);
            --line: rgba(167, 243, 255, .2);
        }
        * { box-sizing: border-box; }
        html { background: #050816; }
        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 50% -10%, #273d75 0, transparent 34rem),
                radial-gradient(circle at 0% 90%, #302064 0, transparent 28rem),
                #050816;
            color: var(--ink);
            font: 16px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
        }
        main { width: min(100% - 2rem, 56rem); margin: auto; padding: 2.5rem 0 2rem; }
        header { position: relative; margin-bottom: 1.5rem; text-align: center; }
        h1 {
            margin: 0;
            font-size: clamp(2.4rem, 10vw, 5.5rem);
            letter-spacing: -.07em;
            line-height: .95;
            text-shadow: 0 0 1.5rem #a7f3ff55, .08em .08em 0 #ff6ba633;
        }
        header p { margin: .75rem auto 0; max-width: 34rem; color: var(--muted); }
        .card {
            position: relative;
            overflow: hidden;
            padding: clamp(1.25rem, 5vw, 2.5rem);
            border: 1px solid var(--line);
            border-radius: 1.5rem;
            background: linear-gradient(145deg, #10213dd9, var(--panel));
            box-shadow: 0 2rem 5rem #0008, inset 0 1px #ffffff18;
            animation: arrive .35s ease-out both;
        }
        .card::before {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: repeating-linear-gradient(0deg, transparent 0 5px, #ffffff03 6px 7px);
            content: "";
            pointer-events: none;
        }
        .card::after {
            position: absolute;
            top: -5rem;
            right: -3rem;
            width: 14rem;
            height: 14rem;
            border-radius: 50%;
            background: var(--pink);
            content: "";
            filter: blur(5rem);
            opacity: .13;
            pointer-events: none;
        }
        .field-label { display: block; margin-bottom: .65rem; color: var(--muted); font-size: .85rem; font-weight: 700; }
        select, input, button, textarea {
            width: 100%;
            border: 1px solid #6e91ad66;
            border-radius: .8rem;
            padding: .85rem 1rem;
            font: inherit;
        }
        select, input, textarea { background: #071225cc; color: var(--ink); }
        select { min-height: 3.25rem; }
        input { min-height: 3.25rem; }
        select:focus, input:focus, textarea:focus { border-color: var(--ice); box-shadow: 0 0 0 .25rem #a7f3ff1c, 0 0 1.5rem #a7f3ff22; outline: none; }
        button {
            min-height: 3.25rem;
            background: linear-gradient(110deg, var(--pink), #ffab6e 45%, var(--gold));
            background-size: 200% 100%;
            color: #1d1020;
            cursor: pointer;
            font-weight: 850;
            transition: transform .2s ease, box-shadow .2s ease, background-position .5s ease;
        }
        button:hover:not(:disabled) { background-position: 100% 0; box-shadow: 0 .7rem 2rem #ff6ba655; transform: translateY(-2px); }
        button:active:not(:disabled) { transform: translateY(1px) scale(.98); }
        button:focus-visible { outline: 3px solid var(--ice); outline-offset: 3px; }
        button:disabled { cursor: not-allowed; opacity: .45; }
        .primary { margin-top: 1rem; }
        .result {
            position: relative;
            z-index: 1;
            margin-top: 1.5rem;
            padding: 1.25rem;
            border: 1px solid #ffd16688;
            border-radius: 1rem;
            background: linear-gradient(135deg, #28335dcc, #521e4ccc);
            text-align: center;
            animation: reveal .7s cubic-bezier(.2, 1.4, .4, 1) both;
        }
        .result-label { color: #ffdcb0; font-size: .8rem; font-weight: 800; }
        .result code { display: block; margin: .4rem 0 1rem; color: var(--gold); font-size: clamp(1.5rem, 6vw, 2.4rem); font-weight: 900; letter-spacing: .08em; overflow-wrap: anywhere; text-shadow: 0 0 .9rem #ffd16688; }
        .decoder {
            position: relative;
            z-index: 1;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #ffffff14;
        }
        .decoder h2 { margin: 0 0 .3rem; font-size: 1.05rem; }
        .decode-output {
            min-height: 3.2rem;
            margin-top: 1rem;
            padding: .8rem 1rem;
            border: 1px dashed #a7f3ff77;
            border-radius: .8rem;
            background: #a7f3ff0b;
            color: var(--ice);
            font-size: 1.25rem;
            font-weight: 800;
            overflow-wrap: anywhere;
        }
        .decode-output:empty { display: none; }
        .decode-output.decoding { color: var(--ice); background: #a7f3ff1c; }
        .decode-output.success { animation: decoded .7s cubic-bezier(.2, 1.5, .4, 1) both; }
        footer { color: var(--muted); font-size: .8rem; text-align: center; }
        #status { margin: 1.25rem 0 0; }
        .error { color: #ffaaa7 !important; }
        @keyframes arrive { from { opacity: 0; transform: translateY(2rem) scale(.95) rotateX(5deg); } to { opacity: 1; transform: none; } }
        @keyframes reveal { from { opacity: 0; transform: translateY(1rem) scale(.9) rotateX(-15deg); } to { opacity: 1; transform: none; } }
        @keyframes decoded { 0% { opacity: 0; transform: scale(.7) rotate(-2deg); filter: blur(12px); } 70% { transform: scale(1.06) rotate(1deg); } 100% { opacity: 1; transform: none; filter: none; } }
        @keyframes shimmer { to { background-position: -200% 0; } }
        @keyframes signalFlicker { 50% { opacity: .55; } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main>
    <header>
        <h1>🎄 Karácsonyi húzás</h1>
        <p>Válaszd ki a neved, és tudd meg, kinek készülj ajándékkal!</p>
    </header>
    <section class="card" aria-label="Karácsonyi húzás eredménye">
        <label class="field-label" for="person">A neved</label>
        <select id="person" disabled>
            <option>Betöltés…</option>
        </select>
        <div class="result" id="result" hidden aria-live="polite">
            <label class="field-label" for="name-confirmation">Írd be újra a neved a felfedéshez</label>
            <input id="name-confirmation" type="text" autocomplete="off" disabled>
            <button class="primary" id="reveal" type="button" disabled>◉ Felfedés</button>
        </div>
        <div class="decoder" id="decoder">
            <h2>◈ A kihúzott név</h2>
            <div class="decode-output" id="decode-output" aria-live="polite"></div>
        </div>
    </section>
    <footer><p id="status">A húzás betöltése…</p></footer>
    </main>
    <script>
        const personSelect = document.querySelector("#person");
        const revealButton = document.querySelector("#reveal");
        const resultBox = document.querySelector("#result");
        const nameConfirmation = document.querySelector("#name-confirmation");
        const decodeOutput = document.querySelector("#decode-output");
        const status = document.querySelector("#status");
        let selectedAssignment;
        let activeAnimation;

        function decodeBase64(value) {
            const bytes = Uint8Array.from(atob(value.trim()), (character) => character.charCodeAt(0));
            return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
        }

        function runDecode(value, names) {
            if (activeAnimation) window.clearTimeout(activeAnimation);
            decodeOutput.className = "decode-output decoding";
            let decodedName;
            try {
                decodedName = decodeBase64(value);
            } catch {
                decodeOutput.textContent = "Érvénytelen titkos jel.";
                decodeOutput.className = "decode-output error";
                status.textContent = "A felfedés nem sikerült.";
                status.classList.add("error");
                return;
            }
            status.classList.remove("error");
            status.textContent = "A név felfedése…";
            revealButton.disabled = true;
            const targetIndex = names.indexOf(decodedName);
            const totalSteps = names.length * 2 + targetIndex + 1;
            let step = 0;
            const rotate = () => {
                decodeOutput.textContent = names[step % names.length];
                step += 1;
                if (step < totalSteps) {
                    const progress = step / totalSteps;
                    const delay = 45 + Math.round(progress * 75);
                    activeAnimation = window.setTimeout(rotate, delay);
                    return;
                }
                decodeOutput.textContent = `🎁 ${decodedName}`;
                decodeOutput.className = "decode-output success";
                activeAnimation = null;
                revealButton.disabled = false;
                status.textContent = "Megvan! Tartsd titokban.";
            };
            rotate();
        }

        fetch("result.json")
            .then((response) => {
                if (!response.ok) throw new Error(`Could not load result.json (${response.status})`);
                return response.json();
            })
            .then((result) => {
                personSelect.replaceChildren(new Option("Válaszd ki a neved…", ""));
                result.forEach(({ person }) => personSelect.add(new Option(person, person)));
                personSelect.disabled = false;
                status.textContent = "Válaszd ki a neved.";
                personSelect.addEventListener("change", () => {
                    if (activeAnimation) window.clearTimeout(activeAnimation);
                    activeAnimation = null;
                    selectedAssignment = result.find(({ person }) => person === personSelect.value);
                    resultBox.hidden = !selectedAssignment;
                    nameConfirmation.value = "";
                    nameConfirmation.disabled = !selectedAssignment;
                    revealButton.disabled = true;
                    decodeOutput.className = "decode-output";
                    decodeOutput.textContent = "";
                    status.textContent = selectedAssignment
                        ? "Írd be újra a neved a felfedéshez."
                        : "Válaszd ki a neved.";
                });
                nameConfirmation.addEventListener("input", () => {
                    const confirmed = Boolean(
                        selectedAssignment
                        && nameConfirmation.value.trim() === selectedAssignment.person
                    );
                    revealButton.disabled = !confirmed;
                    if (confirmed) {
                        status.textContent = "A neved megerősítve. Most már felfedheted a húzást.";
                    } else if (selectedAssignment) {
                        status.textContent = "Írd be pontosan a kiválasztott nevet.";
                    }
                });
                revealButton.addEventListener("click", () => {
                    if (
                        !selectedAssignment
                        || nameConfirmation.value.trim() !== selectedAssignment.person
                    ) return;
                    runDecode(selectedAssignment.pulled, result.map(({ person }) => person));
                });
            })
            .catch((error) => {
                personSelect.replaceChildren();
                status.textContent = `Hiba a húzás betöltésekor: ${error.message}`;
                status.classList.add("error");
            });

    </script>
</body>
</html>
